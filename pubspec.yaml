name: prahar
description: Crowdsourced Civic Issue Reporting - Flutter + Firebase Prototype
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ">=2.18.0 <3.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.6.0
  cloud_firestore: ^4.8.0
  firebase_storage: ^11.3.0

  # State management & utilities
  provider: ^6.0.5
  uuid: ^3.0.7

  # Maps & geolocation
  flutter_map: ^8.1.1
  latlong2: ^0.9.0
  geolocator: ^9.0.2

  # Image picker
  image_picker: ^0.8.7+5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.1

flutter:
  uses-material-design: true
